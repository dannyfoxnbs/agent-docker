name: portable-agents

x-agent: &agent
  image: portable-agents:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INSTALL_AZURE_CLI: ${INSTALL_AZURE_CLI:-false}
      BUILD_INPUTS_SHA: ${BUILD_INPUTS_SHA:-unknown}
  init: true
  stdin_open: true
  tty: true
  working_dir: /workspace
  environment:
    - ANTHROPIC_API_KEY
    - ANTHROPIC_AUTH_TOKEN
    - CLAUDE_CODE_OAUTH_TOKEN
    - OPENAI_API_KEY
    - TERM
    - AZURE_DEVOPS_EXT_PAT
    - ADO_ORG
    - ADO_PROJECT

x-eslint-rules: &eslint-rules
  type: bind
  source: ${AGENT_ESLINT_RULES:-../agent-eslint-rules}
  target: /opt/agent-eslint-rules
  read_only: true

services:
  claude:
    <<: *agent
    command: ["claude"]
    volumes:
      - type: bind
        source: ${WORKSPACE:-..}
        target: /workspace
      - type: bind
        source: ../skills
        target: /opt/agent-skills
        read_only: true
      - type: bind
        source: ../config
        target: /opt/agent-config
      - *eslint-rules
      - claude-state:/home/node/.claude

  codex:
    <<: *agent
    command: ["codex"]
    volumes:
      - type: bind
        source: ${WORKSPACE:-..}
        target: /workspace
      - type: bind
        source: ../skills
        target: /opt/agent-skills
        read_only: true
      - type: bind
        source: ../config
        target: /opt/agent-config
      - codex-state:/home/node/.codex

  pi:
    <<: *agent
    command: ["pi"]
    volumes:
      - type: bind
        source: ${WORKSPACE:-..}
        target: /workspace
      - type: bind
        source: ../skills
        target: /opt/agent-skills
        read_only: true
      - type: bind
        source: ../config
        target: /opt/agent-config
      - *eslint-rules
      - pi-state:/home/node/.pi

  omp:
    <<: *agent
    command: ["omp"]
    # omp discovers models from a running llama-server or LM Studio by itself.
    # host.docker.internal is the machine running Docker: the Windows host under
    # Docker Desktop, mapped explicitly so plain Docker Engine resolves it too.
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_AUTH_TOKEN
      - OPENAI_API_KEY
      - TERM
      - AZURE_DEVOPS_EXT_PAT
      - ADO_ORG
      - ADO_PROJECT
      - LLAMA_CPP_BASE_URL=${LLAMA_CPP_BASE_URL:-http://host.docker.internal:8080}
      - LM_STUDIO_BASE_URL
      - OLLAMA_HOST
    volumes:
      - type: bind
        source: ${WORKSPACE:-..}
        target: /workspace
      - type: bind
        source: ../skills
        target: /opt/agent-skills
        read_only: true
      - type: bind
        source: ../config
        target: /opt/agent-config
      - omp-state:/home/node/.omp

volumes:
  claude-state:
  codex-state:
  pi-state:
  omp-state:
